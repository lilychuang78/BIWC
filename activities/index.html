<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="BIWC activities and events for members.">
	<title>Activities | Berlin International Women's Club</title>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">

	<link rel="stylesheet" href="../css/global.css">
	<link rel="stylesheet" href="../css/header.css">
	<link rel="stylesheet" href="../css/footer.css">

	<style>
		.activities-page {
			padding: 40px 0 64px;
		}

		.activities-heading {
			margin-bottom: 28px;
			text-align: center;
		}

		.activities-heading h1 {
			margin-bottom: 0;
		}

		.activities-gallery {
			display: grid;
			grid-template-columns: repeat(6, minmax(0, 1fr));
			gap: 24px;
		}

		.activity-image {
			width: 100%;
			height: auto;
			grid-column: span 2;
			border: 1px solid var(--beige);
			background: var(--cream);
		}

		.activity-lightbox-link {
			display: block;
			grid-column: span 2;
			cursor: zoom-in;
		}

		.activity-lightbox-link .activity-image {
			grid-column: auto;
		}

		.activity-lightbox-link:nth-child(4) {
			grid-column: 2 / span 2;
		}

		.activity-lightbox-link:nth-child(5) {
			grid-column: 4 / span 2;
		}

		.activity-lightbox {
			position: fixed;
			inset: 0;
			z-index: 10;
			display: grid;
			place-items: center;
			padding: 24px;
			background: rgba(29, 24, 22, .88);
		}

		.activity-lightbox[hidden] {
			display: none;
		}

		.activity-lightbox-image {
			max-width: min(100%, 1200px);
			max-height: calc(100vh - 48px);
			width: auto;
			height: auto;
			object-fit: contain;
			background: var(--white);
		}

		.activity-lightbox-close {
			position: absolute;
			top: 16px;
			right: 20px;
			width: 44px;
			height: 44px;
			border: 1px solid rgba(255, 255, 255, .7);
			border-radius: 50%;
			background: transparent;
			color: var(--white);
			font-size: 30px;
			line-height: 1;
			cursor: pointer;
		}

		@media (max-width: 620px) {
			.activities-page {
				padding: 32px 0 48px;
			}

			.activities-gallery {
				grid-template-columns: 1fr;
				gap: 16px;
			}

			.activity-lightbox-link,
			.activity-lightbox-link:nth-child(4),
			.activity-lightbox-link:nth-child(5) {
				grid-column: auto;
			}

			.activity-lightbox {
				padding: 16px;
			}

			.activity-lightbox-image {
				max-height: calc(100vh - 32px);
			}
		}
	</style>
</head>

<body>
	<div id="site-header"></div>

	<main>
		<section class="activities-page">
			<div class="container">
				<div class="activities-heading">
					<h1>Activities</h1>
				</div>

				<div class="activities-gallery">
					<a class="activity-lightbox-link" href="../images/activity1.png" data-lightbox-image="../images/activity1.png" data-lightbox-alt="Activities calendar, first view">
						<img class="activity-image" src="../images/activity1.png" alt="Activities calendar, first view">
					</a>
					<a class="activity-lightbox-link" href="../images/activity2.png" data-lightbox-image="../images/activity2.png" data-lightbox-alt="Activities calendar, second view">
						<img class="activity-image" src="../images/activity2.png" alt="Activities calendar, second view">
					</a>
					<a class="activity-lightbox-link" href="../images/activity3.png" data-lightbox-image="../images/activity3.png" data-lightbox-alt="Activities calendar, third view">
						<img class="activity-image" src="../images/activity3.png" alt="Activities calendar, third view">
					</a>
					<a class="activity-lightbox-link" href="../images/activity4.png" data-lightbox-image="../images/activity4.png" data-lightbox-alt="Activities calendar, fourth view">
						<img class="activity-image" src="../images/activity4.png" alt="Activities calendar, fourth view">
					</a>
					<a class="activity-lightbox-link" href="../images/activity5.png" data-lightbox-image="../images/activity5.png" data-lightbox-alt="Activities calendar, fifth view">
						<img class="activity-image" src="../images/activity5.png" alt="Activities calendar, fifth view">
					</a>
				</div>
			</div>
		</section>
	</main>

	<div class="activity-lightbox" id="activity-lightbox" role="dialog" aria-modal="true" aria-label="Expanded activity image" hidden>
		<button class="activity-lightbox-close" type="button" aria-label="Close expanded image">&times;</button>
		<img class="activity-lightbox-image" src="" alt="">
	</div>

	<div id="site-footer"></div>

	<script src="../js/components.js"></script>
	<script>
		const lightbox = document.getElementById('activity-lightbox');
		const lightboxImage = lightbox.querySelector('.activity-lightbox-image');
		const lightboxClose = lightbox.querySelector('.activity-lightbox-close');

		function closeLightbox() {
			lightbox.hidden = true;
			document.body.style.overflow = '';
		}

		document.querySelectorAll('[data-lightbox-image]').forEach((link) => {
			link.addEventListener('click', (event) => {
				event.preventDefault();
				lightboxImage.src = link.dataset.lightboxImage;
				lightboxImage.alt = link.dataset.lightboxAlt;
				lightbox.hidden = false;
				document.body.style.overflow = 'hidden';
				lightboxClose.focus();
			});
		});

		lightboxClose.addEventListener('click', closeLightbox);
		lightbox.addEventListener('click', (event) => {
			if (event.target === lightbox) {
				closeLightbox();
			}
		});
		document.addEventListener('keydown', (event) => {
			if (event.key === 'Escape' && !lightbox.hidden) {
				closeLightbox();
			}
		});
	</script>
</body>
</html>
